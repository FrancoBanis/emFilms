<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .f1 { animation: show1 6s infinite step-start; }
      .f2 { animation: show2 6s infinite step-start; }
      .f3 { animation: show3 6s infinite step-start; }

      @keyframes show1 {
        0%   { opacity: 1; }
        33%  { opacity: 0; }
        66%  { opacity: 0; }
      }
      @keyframes show2 {
        0%   { opacity: 0; }
        33%  { opacity: 1; }
        66%  { opacity: 0; }
      }
      @keyframes show3 {
        0%   { opacity: 0; }
        33%  { opacity: 0; }
        66%  { opacity: 1; }
      }
    </style>
    <clipPath id="screen">
      <rect x="0" y="0" width="32" height="32" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background negro puro como EmFilms -->
  <rect width="32" height="32" rx="4" fill="#111111"/>

  <!-- Línea roja inferior decorativa (igual que la del sitio) -->
  <rect x="0" y="29" width="32" height="3" fill="#e50914"/>

  <g clip-path="url(#screen)">

    <!-- Piso sutil para dar profundidad -->
    <rect x="0" y="21" width="32" height="8" fill="#0a0a0a"/>

    <!-- ======= FRAME 1: Hombre + Mujer ======= -->
    <g class="f1">
      <!-- Hombre izquierda -->
      <circle cx="7.5" cy="10" r="2.6" fill="#f0c89a"/>
      <path d="M4.9,9.5 Q7.5,6.5 10.1,9.5" fill="#2a1a08" stroke="none"/>
      <rect x="5" y="12.8" width="5" height="5" rx="1" fill="#cccccc"/>
      <rect x="3.3" y="12.8" width="1.7" height="3.5" rx="0.8" fill="#cccccc"/>
      <rect x="10" y="12.8" width="1.7" height="3.5" rx="0.8" fill="#cccccc"/>
      <rect x="5.2" y="17.8" width="2" height="6" rx="0.6" fill="#444444"/>
      <rect x="7.8" y="17.8" width="2" height="6" rx="0.6" fill="#444444"/>

      <!-- Mujer derecha -->
      <circle cx="24.5" cy="10" r="2.6" fill="#f0c89a"/>
      <path d="M21.8,9.5 Q24.5,6 27.2,9.5 L27.5,15 Q24.5,16 21.5,15Z" fill="#6b3000" opacity="0.9"/>
      <polygon points="22,12.8 27,12.8 29,24 20,24" fill="#e50914"/>
      <rect x="23.3" y="12.8" width="2.4" height="1.8" rx="0.5" fill="#ff6b6b"/>
    </g>

    <!-- ======= FRAME 2: Hombre + Hombre ======= -->
    <g class="f2">
      <!-- Hombre izquierda gris -->
      <circle cx="7.5" cy="10" r="2.6" fill="#f0c89a"/>
      <path d="M4.9,9.5 Q7.5,6.5 10.1,9.5" fill="#2a1a08" stroke="none"/>
      <rect x="5" y="12.8" width="5" height="5" rx="1" fill="#cccccc"/>
      <rect x="3.3" y="12.8" width="1.7" height="3.5" rx="0.8" fill="#cccccc"/>
      <rect x="10" y="12.8" width="1.7" height="3.5" rx="0.8" fill="#cccccc"/>
      <rect x="5.2" y="17.8" width="2" height="6" rx="0.6" fill="#444444"/>
      <rect x="7.8" y="17.8" width="2" height="6" rx="0.6" fill="#444444"/>

      <!-- Hombre derecha rojo -->
      <circle cx="24.5" cy="10" r="2.6" fill="#f0c89a"/>
      <path d="M21.9,9.5 Q24.5,6.5 27.1,9.5" fill="#1a0800" stroke="none"/>
      <rect x="22" y="12.8" width="5" height="5" rx="1" fill="#e50914"/>
      <rect x="20.3" y="12.8" width="1.7" height="3.5" rx="0.8" fill="#e50914"/>
      <rect x="27" y="12.8" width="1.7" height="3.5" rx="0.8" fill="#e50914"/>
      <rect x="22.2" y="17.8" width="2" height="6" rx="0.6" fill="#444444"/>
      <rect x="24.8" y="17.8" width="2" height="6" rx="0.6" fill="#444444"/>
    </g>

    <!-- ======= FRAME 3: Mujer + Mujer ======= -->
    <g class="f3">
      <!-- Mujer izquierda roja -->
      <circle cx="7.5" cy="10" r="2.6" fill="#f0c89a"/>
      <path d="M4.8,9.5 Q7.5,6 10.2,9.5 L10.5,15 Q7.5,16 4.5,15Z" fill="#6b3000" opacity="0.9"/>
      <polygon points="5,12.8 10,12.8 12,24 3,24" fill="#e50914"/>
      <rect x="6.3" y="12.8" width="2.4" height="1.8" rx="0.5" fill="#ff6b6b"/>

      <!-- Mujer derecha amarilla -->
      <circle cx="24.5" cy="10" r="2.6" fill="#f0c89a"/>
      <path d="M21.8,9.5 Q24.5,6 27.2,9.5 L27.5,15 Q24.5,16 21.5,15Z" fill="#3d1060" opacity="0.9"/>
      <polygon points="22,12.8 27,12.8 29,24 20,24" fill="#f5a623"/>
      <rect x="23.3" y="12.8" width="2.4" height="1.8" rx="0.5" fill="#ffe08a"/>
    </g>

    <!-- ======= POCHOCLOS (siempre visibles) ======= -->
    <polygon points="14.8,20.5 17.2,20.5 16.9,24.5 15.1,24.5" fill="#e50914"/>
    <line x1="15.6" y1="20.5" x2="15.5" y2="24.5" stroke="white" stroke-width="0.5" opacity="0.4"/>
    <line x1="16.4" y1="20.5" x2="16.5" y2="24.5" stroke="white" stroke-width="0.5" opacity="0.4"/>
    <rect x="14.6" y="20" width="2.8" height="0.8" rx="0.3" fill="#b00710"/>
    <!-- Bolitas -->
    <circle cx="15.1" cy="19.6" r="0.95" fill="#f5f5f5"/>
    <circle cx="16"   cy="19.1" r="1.0"  fill="#ffffff"/>
    <circle cx="16.9" cy="19.6" r="0.95" fill="#f5f5f5"/>
    <circle cx="15.5" cy="20.2" r="0.85" fill="#e8e8e8"/>
    <circle cx="16.5" cy="20.2" r="0.85" fill="#e8e8e8"/>
    <circle cx="16"   cy="18.3" r="0.8"  fill="#ffffff"/>
    <circle cx="15.7" cy="18.1" r="0.22" fill="white" opacity="0.5"/>

  </g>

</svg>
